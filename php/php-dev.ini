; ── FINDIR php-dev.ini (local development) ───────────────────────

[PHP]
display_errors     = On
display_startup_errors = On
error_reporting    = E_ALL
log_errors         = On

; Xdebug (опционально, раскомментировать если нужен)
; zend_extension=xdebug
; xdebug.mode=debug
; xdebug.start_with_request=yes
; xdebug.client_host=host.docker.internal
; xdebug.client_port=9003

; ── OPcache ──────────────────────────────────────────────────────
; Код лежит в папке Windows и попадает в контейнер через мост Docker
; Desktop: чтение файла оттуда стоит на два порядка дороже, чем изнутри
; (замер: 1783 файла — 12,4 с против 61 мс). С выключенным кэшем PHP
; перечитывал и перекомпилировал весь фреймворк на каждый запрос — пустой
; /health отвечал 5 секунд, теперь 0,16 с.
;
; Поэтому кэш включён и в dev, но с проверкой времени правки: свои изменения
; подхватываются сразу, перезапускать контейнер не нужно. Проверка обходится
; дёшево — vendor вынесен в том внутри контейнера (см. docker-compose.yml),
; и на мосту остались только свои ~110 файлов.
;
; revalidate_freq = 0 (проверять на каждый запрос) стоит около 60 мс против
; freq = 2. Разница невелика, а «почему правка не подхватилась» стоит дороже.
opcache.enable              = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq     = 0
opcache.memory_consumption  = 256
opcache.max_accelerated_files = 20000
