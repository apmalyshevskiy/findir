# ══════════════════════════════════════════════════════════════════
#  FINDIR — внутренний nginx (HTTP-only)
#  Стоит за host-nginx, который терминирует TLS для
#  findir.161-104-34-180.sslip.io и проксирует сюда (127.0.0.1:8090).
# ══════════════════════════════════════════════════════════════════

upstream php_fpm {
    server php:9000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    client_max_body_size 64M;

    # ── API / Horizon → Laravel (public/index.php) ────────────────
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /horizon {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /sanctum/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Storage (публичные файлы Laravel) ─────────────────────────
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PHP-FPM (исполняется только public/index.php) ─────────────
    location = /index.php {
        fastcgi_pass   php_fpm;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        # Проброс исходной схемы от host-nginx (для генерации https-URL)
        fastcgi_param  HTTPS on;
        fastcgi_param  HTTP_X_FORWARDED_PROTO https;
    }

    # ── React SPA — всё остальное ─────────────────────────────────
    location / {
        root /var/www/web;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
}
