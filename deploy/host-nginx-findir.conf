# ══════════════════════════════════════════════════════════════════
#  host-nginx: поддомен FINDIR → docker-nginx (127.0.0.1:8090)
#  Кладётся в /etc/nginx/sites-available/findir.conf + symlink в
#  sites-enabled. TLS добавит certbot --nginx.
#  Файл сайта доставки (fp_site.conf) НЕ трогаем.
# ══════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name findir.161-104-34-180.sslip.io;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
