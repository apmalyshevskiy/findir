# ══════════════════════════════════════════════════════════════════════
#  FINDIR — Production Docker Compose
#  Хост:  findir.161-104-34-180.sslip.io  (за host-nginx, TLS на хосте)
#  БД:    хостовая MariaDB (systemd), доступ через docker0-шлюз 172.17.0.1
#
#  Топология:
#    host-nginx  →  127.0.0.1:8090  →  этот nginx (HTTP)  →  php-fpm
#    php/horizon/scheduler  →  172.17.0.1:3306  →  MariaDB на хосте
#
#  Конфиг Laravel — в back/.env (см. deploy/env.prod.example).
#  Запуск:  docker compose -f docker-compose.prod.yml up -d
# ══════════════════════════════════════════════════════════════════════

services:

  # ── Сборка фронта (одноразовый контейнер) ─────────────────────────
  # Профиль "build" → обычный `up -d` его НЕ запускает.
  # Пересобрать фронт: docker compose -f docker-compose.prod.yml run --rm frontend-build
  frontend-build:
    image: node:20-alpine
    profiles: ["build"]
    working_dir: /app
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"   # ограничение под 2ГБ RAM без swap
    volumes:
      - ./front:/app
      - web_build:/out
    command: >
      sh -c "npm ci --legacy-peer-deps &&
             npm run build &&
             rm -rf /out/* &&
             cp -r dist/. /out/ &&
             echo 'FRONT BUILD DONE'"
    networks:
      - findir_net

  # ── PHP-FPM (Laravel API) ─────────────────────────────────────────
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    image: findir_php:latest
    container_name: findir_php
    restart: always
    volumes:
      - ./back:/var/www/html          # включая back/.env
      # Лимиты памяти и размера загрузки. Без этого контейнер живёт на дефолтах
      # php (128M / upload 2M), и восстановление архивной копии не проходит.
      # Правка файла требует пересоздания контейнера: bind-mount одиночного
      # файла остаётся на старом inode (то же правило, что и для nginx-конфига).
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-findir.ini:ro
    networks:
      - findir_net                    # БД — хостовая MariaDB через 172.17.0.1
    depends_on:
      - redis

  # ── Nginx (HTTP-only, за host-nginx) ──────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: findir_nginx
    restart: always
    ports:
      - "127.0.0.1:8090:80"           # только localhost; TLS терминирует host-nginx
    volumes:
      - ./nginx/conf.d/findir-internal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./back:/var/www/html          # public/ и storage/
      - web_build:/var/www/web:ro     # собранный SPA
    depends_on:
      - php
    networks:
      - findir_net

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: findir_redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - findir_net

  # ── Horizon (очереди) ─────────────────────────────────────────────
  horizon:
    image: findir_php:latest
    container_name: findir_horizon
    restart: always
    command: sh -c "sleep 10 && php /var/www/html/artisan horizon"
    volumes:
      - ./back:/var/www/html
    networks:
      - findir_net
    depends_on:
      - redis
      - php

  # ── Scheduler ─────────────────────────────────────────────────────
  scheduler:
    image: findir_php:latest
    container_name: findir_scheduler
    restart: always
    command: sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./back:/var/www/html
    networks:
      - findir_net
    depends_on:
      - redis
      - php

volumes:
  redis_data:
  web_build:

networks:
  findir_net:
    driver: bridge
