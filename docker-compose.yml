# FINDIR — Docker Compose (dev) — MariaDB

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: findir_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./back:/var/www/html
    depends_on:
      - php
    networks:
      - findir_net

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: findir_php
    restart: always
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:rxG0Xd+0d5fvgounk8ck7yqSW4oEVcWGL+V/1MJccOM="
      APP_URL: "http://localhost"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: findir_central
      DB_USERNAME: findir
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: 120
    volumes:
      - ./back:/var/www/html
      # vendor живёт внутри контейнера, а не в папке Windows.
      #
      # Мост Docker Desktop между Windows и Linux стоит дорого на каждом файле:
      # обход vendor (8249 файлов) через него — 14 с, свой код (110 файлов) —
      # 0,19 с. Пока vendor был снаружи, PHP проверял его на каждом запросе, и
      # пустой /health отвечал 5 секунд.
      #
      # Плата за это: composer запускать внутри контейнера —
      #   docker compose exec php composer install
      # На хосте back/vendor остаётся для подсказок IDE, но контейнер его
      # не видит и не читает.
      - vendor_data:/var/www/html/vendor
      # Те же лимиты, что и на проде, — иначе разница вылезает только там
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-findir.ini:ro
      # Грузится последним и гасит opcache: в образе стоит validate_timestamps=0,
      # и без этого каждая правка кода требовала бы перезапуска контейнера
      - ./php/php-dev.ini:/usr/local/etc/php/conf.d/zzz-findir-dev.ini:ro
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - mariadb
      - redis
    networks:
      - findir_net

  mariadb:
    image: mariadb:11.4
    container_name: findir_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootsecret
      MARIADB_DATABASE: findir_central
      MARIADB_USER: findir
      MARIADB_PASSWORD: secret
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/01-grants.sql:ro
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - findir_net

  redis:
    image: redis:7.2-alpine
    container_name: findir_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - findir_net

  horizon:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: findir_horizon
    restart: unless-stopped
    command: sh -c "sleep 30 && php /var/www/html/artisan horizon"
    # vendor — тот же том, что у php: см. пояснение там
    environment:
      APP_ENV: local
      APP_KEY: "base64:rxG0Xd+0d5fvgounk8ck7yqSW4oEVcWGL+V/1MJccOM="
      DB_HOST: mariadb
      DB_DATABASE: findir_central
      DB_USERNAME: findir
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./back:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      - mariadb
      - redis
    networks:
      - findir_net

  scheduler:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: findir_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php /var/www/html/artisan schedule:run; sleep 60; done"
    # vendor — тот же том, что у php: см. пояснение там
    environment:
      APP_ENV: local
      APP_KEY: "base64:rxG0Xd+0d5fvgounk8ck7yqSW4oEVcWGL+V/1MJccOM="
      DB_HOST: mariadb
      DB_DATABASE: findir_central
      DB_USERNAME: findir
      DB_PASSWORD: secret
      REDIS_HOST: redis
    volumes:
      - ./back:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      - mariadb
      - redis
    networks:
      - findir_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: findir_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - findir_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: findir_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: findir
      PMA_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    networks:
      - findir_net

  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: findir_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - findir_net

  web:
    image: node:20-slim
    container_name: findir_front
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      # node_modules — внутри контейнера, по той же причине, что и vendor
      # у php: через мост Windows каждый файл читается на два порядка дольше,
      # а их тут десятки тысяч. Заодно на хосте остаётся своя папка — та,
      # что ставилась под Windows, и её больше не перетирает установка
      # из контейнера (собранные под Linux бинарники в ней ломали npm)
      - node_modules_data:/app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    networks:
      - findir_net

volumes:
  mariadb_data:
  redis_data:
  # Зависимости composer — внутри Linux, а не в папке Windows (см. службу php)
  vendor_data:
  # То же самое для зависимостей фронта (см. службу web)
  node_modules_data:

networks:
  findir_net:
    driver: bridge
